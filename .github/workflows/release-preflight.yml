name: Foundation release preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [release]

permissions:
  contents: read

concurrency:
  group: foundation-release-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LEIN_JVM_OPTS: -Xms512m -Xmx3g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp

jobs:
  release-ready:
    if: github.event.pull_request.draft == false
    name: release ready
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout the proposed release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release origin and version
        id: release
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REF" = main
          test "$BASE_REF" = release

          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" main release

          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            parents="$(git show -s --format=%P "$BASE_SHA")"
            read -r -a parents <<<"$parents"
            test "${#parents[@]}" = 2
            git merge-base --is-ancestor "${parents[1]}" "$HEAD_SHA"
          fi

          project_name="$(
            ./lein exec -e \
              '(require (quote leiningen.core.project)) (let [project (leiningen.core.project/read "project.clj")] (println (str (:group project) "/" (:name project))))' \
              | tail -n 1
          )"
          project_version="$(
            ./lein exec -e \
              '(require (quote leiningen.core.project)) (println (:version (leiningen.core.project/read "project.clj")))' \
              | tail -n 1
          )"

          test "$project_name" = xyz.zcaudate/foundation-base
          [[ "$project_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$project_version" != *SNAPSHOT* ]]

          {
            echo "name=$project_name"
            echo "version=$project_version"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Release contract'
            echo
            echo "- Coordinate: \`$project_name\`"
            echo "- Version: \`$project_version\`"
            echo "- Promotion: \`main -> release\`"
            echo "- Proposed commit: \`$HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare package-only repository configuration
        run: ./scripts/release/prepare-clojars-config.sh package

      - name: Generate and inspect release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          trap 'rm -f config/repositories.edn; rm -rf target/interim' EXIT
          ./lein pom
          ./lein jar
          ./lein package-clojars

          jars="$(find target/interim -type f -name '*.jar' | wc -l | tr -d ' ')"
          poms="$(find target/interim -type f -name '*.pom.xml' | wc -l | tr -d ' ')"
          test "$jars" -gt 0
          test "$jars" = "$poms"
          test ! -e "target/interim/xyz.zcaudate/foundation-base"

          while IFS= read -r artifact; do
            case "$artifact" in
              *-"$VERSION".jar|*-"$VERSION".pom.xml) ;;
              *)
                echo "unexpected artifact version: $artifact" >&2
                exit 1
                ;;
            esac
          done < <(find target/interim -type f \( -name '*.jar' -o -name '*.pom.xml' \))

          {
            echo
            echo "### Split-package artifact preflight"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Packages: \`$jars\`"
            echo "- JAR/POM inventory: \`$jars/$poms\`"
            echo "- Root artifact: not included in the split-package inventory"
          } >> "$GITHUB_STEP_SUMMARY"
