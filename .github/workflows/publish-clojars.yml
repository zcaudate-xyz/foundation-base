name: Publish Foundation Base to Clojars

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

concurrency:
  group: foundation-clojars-${{ github.ref_name }}
  cancel-in-progress: false

env:
  LEIN_JVM_OPTS: -Xms512m -Xmx3g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish Clojars release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment:
      name: clojars

    steps:
      - name: Checkout the tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate tag, release branch, and project version
        id: release
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch origin main release --tags --force
          test "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse origin/release)" = "$GITHUB_SHA"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            parents="$(git show -s --format=%P "$GITHUB_SHA")"
            read -r -a parents <<<"$parents"
            test "${#parents[@]}" = 2
            git merge-base --is-ancestor "${parents[1]}" origin/main
          fi

          project_name="$(
            ./lein exec -e \
              '(require (quote leiningen.core.project)) (let [project (leiningen.core.project/read "project.clj")] (println (str (:group project) "/" (:name project))))' \
              | tail -n 1
          )"
          project_version="$(
            ./lein exec -e \
              '(require (quote leiningen.core.project)) (println (:version (leiningen.core.project/read "project.clj")))' \
              | tail -n 1
          )"
          expected_tag="v${project_version}"

          test "$project_name" = xyz.zcaudate/foundation-base
          test "$TAG_NAME" = "$expected_tag"
          [[ "$project_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$project_version" != *SNAPSHOT* ]]

          {
            echo "name=$project_name"
            echo "version=$project_version"
            echo "commit=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Clojars release contract'
            echo
            echo "- Coordinate: \`$project_name\`"
            echo "- Version: \`$project_version\`"
            echo "- Tag: \`$TAG_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create test database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -d test-scratch -c 'CREATE DATABASE test;'
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -d test-scratch -c 'GRANT ALL PRIVILEGES ON DATABASE test TO postgres;'

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime images
        run: |
          docker pull ghcr.io/zcaudate-xyz/foundation-base/rt-twostep-haskell:latest
          docker pull ghcr.io/zcaudate-xyz/foundation-base/rt-twostep-lean:latest
          docker pull ghcr.io/zcaudate-xyz/foundation-base/rt-twostep-ocaml:latest
          docker pull ghcr.io/zcaudate-xyz/foundation-base/rt-basic-blender:latest

      - name: Install JavaScript parser dependencies
        run: npm ci
        working-directory: scripts/js_parser

      - name: Test, package, and publish the root artifact
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLOJARS_USERNAME"
          test -n "$CLOJARS_PASSWORD"
          mkdir -p .tmp
          docker run --network host \
            -e 'CI=true' \
            -e "LEIN_JVM_OPTS=${LEIN_JVM_OPTS} -Djava.io.tmpdir=$(pwd)/.tmp" \
            -e "_JAVA_OPTIONS=-Djava.io.tmpdir=$(pwd)/.tmp" \
            -e CLOJARS_USERNAME \
            -e CLOJARS_PASSWORD \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /home/runner/.docker/config.json:/root/.docker/config.json:ro \
            -v "$(pwd):$(pwd)" \
            -w "$(pwd)" \
            ghcr.io/zcaudate-xyz/infra-foundation-clean:ci \
            bash -lc 'set -euxo pipefail &&
              apt-get update &&
              apt-get install -y --no-install-recommends lua5.4 python3 python3-pip redis-server &&
              lein test &&
              lein pom &&
              lein jar &&
              lein deploy-root'

      - name: Summarize published release
        run: |
          {
            echo '### Clojars publication'
            echo
            echo "- Coordinate: \`${{ steps.release.outputs.name }}\`"
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- Tag: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Registry: https://clojars.org/"
          } >> "$GITHUB_STEP_SUMMARY"

    services:
      postgres:
        image: ghcr.io/zcaudate-xyz/infra-db:main
        env:
          POSTGRES_DB: test-scratch
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
