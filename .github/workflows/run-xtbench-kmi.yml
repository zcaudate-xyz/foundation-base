name: XTBench Core KMI

on:
  push:
    branches: [main, 'lang/dart', 'lang/python', 'lang/lua']
  repository_dispatch:
  workflow_dispatch:

env:
  LEIN_JVM_OPTS: -Xms512m -Xmx3g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp

concurrency:
  group: xtbench-core-kmi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  run-xtbench-kmi-tests:
    name: 10 - kmi.lang / ${{ matrix.lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: dart
            image: ghcr.io/zcaudate-xyz/infra-foundation-xtbench-dart:ci
          - lang: python
            image: ghcr.io/zcaudate-xyz/infra-foundation-clean:ci
          - lang: lua
            image: ghcr.io/zcaudate-xyz/infra-foundation-clean:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USER }}
          password: ${{ secrets.GH_TOKEN }}

      - name: run
        run: >
          docker run --network host
          -e "LEIN_JVM_OPTS=${LEIN_JVM_OPTS}"
          -v /var/run/docker.sock:/var/run/docker.sock
          -v $(pwd):$(pwd)
          -w $(pwd)
          ${{ matrix.image }}
          lein seedgen test '[kmi.lang]' :with "[${{ matrix.lang }}]" :metrics target/xtbench-metrics/result.json

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xtbench-kmi-${{ matrix.lang }}
          path: target/xtbench-metrics/result.json
          if-no-files-found: warn

  publish-metrics:
    permissions:
      contents: write
    name: Publish metrics
    if: always() && github.ref == 'refs/heads/main'
    needs: [run-xtbench-kmi-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: xtbench-*
          path: target/xtbench-artifacts
      - name: Setup Leiningen
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: latest
      - name: Publish metrics branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash bin/publish-xtbench-metrics core-kmi "$GITHUB_WORKSPACE/target/xtbench-artifacts" "$RUNNER_TEMP/xtbench-branch"
